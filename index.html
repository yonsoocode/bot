<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f0f0f,#1a1a2e);color:white;height:100vh;display:flex;justify-content:center;align-items:center}
.app{width:420px;height:600px;background:rgba(255,255,255,0.05);border-radius:25px;border:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;overflow:hidden}
.header{padding:20px;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.08)}
.chat{flex:1;padding:20px;overflow-y:auto}
.message{margin-bottom:10px;padding:10px;border-radius:10px;max-width:80%}
.user{background:#4f46e5;margin-left:auto}
.bot{background:rgba(255,255,255,0.1)}
.input{display:flex;padding:10px;border-top:1px solid rgba(255,255,255,0.08)}
textarea{flex:1;border-radius:10px;padding:10px;border:none}
button{margin-left:10px;padding:10px;border:none;border-radius:10px;background:#4f46e5;color:white}
</style>
</head>
<body>

<div class="app">
<div class="header">🤖 Step AI</div>
<div class="chat" id="chat"></div>
<div class="input">
<textarea id="input"></textarea>
<button onclick="send()">➤</button>
</div>
</div>

<script>
async function send(){
 const input=document.getElementById("input");
 const text=input.value;
 if(!text)return;

 add(text,"user");
 input.value="";

 const loading=add("Думаю...","bot");

 const res=await fetch("http://localhost:3000/api",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({message:text})
 });

 const data=await res.json();
 loading.innerText=data.reply;
}

function add(text,type){
 const chat=document.getElementById("chat");
 const div=document.createElement("div");
 div.className="message "+type;
 div.innerText=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}
</script>

</body>
</html>
